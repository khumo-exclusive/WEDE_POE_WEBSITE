<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Clothing-Enquiries</title>
</head>
<body>
    <!-- navigation -->
    <header>
        <img src="images/logo3.png" alt="Exclusive Clothing Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a><li>
                <li><a href="about.html">About</a><li>
                <li><a href="services.html">Services</a><li>
                <li><a href="enquiries.html">Enquiries</a><li>
                <li><a href="contact.html">Contact</a><li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Send Us an Enquiry</h1>
        <p>Fill out the form below and we will get back to you as soon as possible.</p>
        <form action="#" method="post">
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                <label for="enquirytype">Type of Enquiry</label><br>
                <select name="enquirytype" id="enquirytype">
                    <option>General Question</option>
                    <option>Product Availability</option>
                    <option>Size or Fit Enquiry</option>
                    <option>Special/Bulk Order Quote</option>
                    <option>Return or Exchange</option>
                    <option>Other</option>
                </select>
            </p>
            <p>
                <label for="message">Your Message:</label><br>
                <textarea name="message" id="message" rows="6" cols="40" required></textarea>
            </p>
            <p>
                <input type="submit" value="Submit Enquiry">
            </p>

        </form>
    </main>
    <footer>
        <p>&copy; 2026 Exclusive Clothing. All rights reserved.</p>
    </footer>
</body>
</html>
